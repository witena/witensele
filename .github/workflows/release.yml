# A tag is a release (PLAN.md, "Local release and online version").
#
# `v1.2.3` pushed -> this workflow runs the same checks CI runs, packages both
# macOS architectures, and uploads them to a **draft** GitHub Release that a
# human reads and publishes. Nothing reaches a user without that click.
#
# The upload is done by electron-builder itself (`--publish always` plus the
# `publish:` block in `electron-builder.yml`), not by a separate upload action:
# electron-builder is what writes `latest-mac.yml` and the `.blockmap` files,
# and it writes them *knowing* which release they describe. A generic upload
# step would have to reproduce that feed by hand, and S7.4's `electron-updater`
# reads exactly it. See docs/features/packaging/backend.md, "Publishing".
#
# Signing and notarization (S7.3) are configured in `electron-builder.yml` and
# gated here: the steps below read the `CSC_*` / `APPLE_*` secrets and a gate
# step decides whether they exist. With the secrets absent every one of them
# arrives empty, electron-builder finds no identity and produces the unsigned
# dmg this repository produced before; with them present the same commands sign,
# notarize and verify. The secrets to add are listed in
# docs/features/packaging/implement.md, "The CI secrets".
name: Release

on:
  push:
    tags:
      - 'v*'

# electron-builder creates the draft Release and uploads the artifacts with
# GITHUB_TOKEN, which needs write access to the repository's contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lock file is written by whatever npm the developer runs. npm 11.5
      # omits the optional subtree of a package it does not install on macOS
      # (electron-winstaller's), and a newer npm's `npm ci` refuses such a lock
      # ("Missing: @electron/windows-sign from lock file"). Every PR that added
      # a dependency failed here first. Pin the runner to the developer's npm so
      # the two agree; bump this together with the local toolchain.
      - name: Use the same npm as the lock file's author
        run: npm install -g npm@11.5.1

      - run: npm ci

      # The tag names the version. A stable tag (`v1.2.3`) must already equal
      # `package.json` — `npm version` made both in one commit — and a tag that
      # does not is refused rather than shipped under the wrong number. A
      # nightly tag (`v1.2.4-nightly.20260920`, pushed by
      # `scripts/nightly-tag.mjs`) is never committed anywhere, so it is written
      # into the checkout here: `--ignore-scripts` skips the `preversion` gate
      # (the next two steps are that gate) and the `version` script's `git add`,
      # and `sync-version.mjs` is run by hand so `APP_VERSION` follows and
      # `packaging.test.ts` still finds the two equal.
      - name: Take the version from the tag
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tagged" = "$manifest" ]; then
            echo "Releasing $manifest." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$tagged" =~ -nightly\.[0-9]{8}$ ]]; then
            npm version "$tagged" --no-git-tag-version --ignore-scripts
            node scripts/sync-version.mjs
            echo "Nightly $tagged (package.json says $manifest)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($manifest). Bump with \`npm version\`, which makes the commit and the tag together."
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      # `secrets` is not one of the contexts available to an `if:` expression,
      # at job level or at step level. The supported way to branch on a secret
      # is to read it into `env` in a step that can see it and publish the
      # answer — never the secret — as a step output.
      - name: Decide whether this build can be signed
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK:-}" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Developer ID certificate found: signing and notarizing.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No CSC_LINK secret: building unsigned (S7.3 adds the certificate).' >> "$GITHUB_STEP_SUMMARY"
          fi

      # The certificate goes into a keychain **this workflow** makes, and
      # electron-builder is never given `CSC_LINK`. Both halves were learned
      # from failed `v0.1.0` runs (2026-09-19):
      #
      # - electron-builder 26 can import a `.p12` itself, but after importing it
      #   runs `security set-key-partition-list … -k <the .p12's password>`,
      #   where `-k` wants the password of the *keychain* it created with a
      #   random one. The macOS runner answers "SecKeychainUnlock: The user name
      #   or passphrase you entered is not correct" and the build dies. Here
      #   `-k` gets the keychain's own password.
      # - A missing secret arrives as an **empty string**, not unset, and
      #   electron-builder only asks `cscLink == null`: it resolves '' against
      #   the project directory and dies with "<project dir> not a file". With
      #   the variable absent from the packaging step there is nothing to
      #   misread, signed or not.
      #
      # The keychain is put first in the user search list, which is where
      # `CSC_IDENTITY_AUTO_DISCOVERY` looks, and the decoded `.p12` is deleted
      # before anything else runs.
      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/witena-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$certificate"' EXIT

          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null

          # A `.p12` exported from Keychain Access holds the leaf and its key,
          # not the intermediate that issued it, and an identity whose chain
          # cannot be built is imported but not *valid* — codesign will not use
          # it. A developer's Mac has the intermediates from Xcode; a runner is
          # not promised to (electron-builder ships a keychain of them for the
          # same reason). Both generations, from Apple; a forged one could not
          # chain to the Apple root the system already trusts. Best effort: if
          # the download fails, the check below still decides.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ca.cer" \
              "https://www.apple.com/certificateauthority/$ca.cer"; then
              security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" > /dev/null || true
            else
              echo "::warning::Could not download $ca.cer from Apple."
            fi
          done
          # Word splitting is the point: one argument per existing keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          # Captured rather than piped into `grep -q`: under `pipefail`, grep
          # leaving at its first match sends `security` a SIGPIPE and the step
          # fails on a certificate that is there (the fifth `v0.1.0` run). The
          # listing is printed because "0 valid identities" with one imported
          # means a missing intermediate, and that is only visible here.
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          case "$identities" in
            *'Developer ID Application'*) ;;
            *)
              echo '::error::The imported certificate is not a valid Developer ID Application identity on this runner.'
              security find-identity -p codesigning "$keychain"
              exit 1
              ;;
          esac

      # electron-builder uploads its artifacts in parallel, and each uploader
      # that finds no Release for the tag creates one. The first run that got as
      # far as uploading (2026-09-20) ended with **two** drafts named 0.1.0,
      # created in the same second: eight files in one, the arm64 zip's
      # blockmap alone in the other. Created here, the draft already exists when
      # the first uploader looks, and they all find the same one. A nightly is
      # born flagged as a pre-release for the reason given at the last step.
      - name: Create the draft Release the artifacts will be uploaded to
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A Release for $GITHUB_REF_NAME already exists; uploading into it."
            exit 0
          fi
          flags=(--draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes '')
          if [[ "$GITHUB_REF_NAME" == *-nightly.* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"

      # `npm run dist` is `npm run build && electron-builder --mac`; npm appends
      # the arguments after `--` to the end of that string, so `--publish
      # always` lands on electron-builder. Both architectures come from
      # `mac.target[0].arch` in electron-builder.yml and are built in **one**
      # invocation on purpose: two jobs would each write a `latest-mac.yml`
      # describing only their own dmg, and the second upload would win.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY is the unsigned build's safety catch: with
      # it false, electron-builder cannot quietly sign with whatever identity a
      # runner's keychain happens to hold.
      #
      # `-c.extraMetadata.witenaSignedBuild=true` (S7.3) is added only on a
      # signed build. It writes that field into the `package.json` **inside** the
      # bundle, which is the only copy the launched application can read, and
      # `src/main/index.ts` reads it back to decide whether the Keychain may wrap
      # the secrets key file. Passing it on an unsigned build would tell the app
      # to wrap its key with a Keychain item granted to an identity that changes
      # every time it is packaged — the bug S7.6 exists to fix. It is a shell
      # conditional rather than a step-level `if:` because the two branches
      # differ by one argument to the same command.
      - name: Package both architectures and upload them to a draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.enabled }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "${SIGNING_ENABLED:-false}" = 'true' ]; then
            npm run dist -- --publish always -c.extraMetadata.witenaSignedBuild=true
          else
            npm run dist -- --publish always
          fi

      # Only meaningful once a certificate exists; an unsigned bundle keeps the
      # ad-hoc, linker-signed signature the Electron binary already carries and
      # `spctl` rejects it by design (packaging/backend.md, "The unsigned
      # caveat").
      #
      # The three checks answer three different questions, which is why none of
      # them replaces another: `codesign --verify` that the bundle and everything
      # nested in it is intact and signed, `spctl --assess` that **Gatekeeper**
      # accepts it (the line to look for is `source=Notarized Developer ID`), and
      # `stapler validate` that the notarization ticket was stapled into the
      # bundle — without which the first launch on a machine with no network is
      # refused even though the app is notarized.
      - name: Verify the signature and the notarization ticket
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          for app in dist/mac*/Witena.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "$app"
          done

      # A pre-release version puts the feed on its own channel, so a nightly
      # writes `nightly-mac.yml` where a stable build writes `latest-mac.yml`.
      - name: Show what the draft Release received
        run: ls -lh dist/*.dmg dist/*.blockmap dist/*-mac.yml

      # electron-builder creates the draft without the pre-release flag. If a
      # nightly were published that way GitHub would call it the **latest**
      # release, and every stable install asks `releases/latest` for a
      # `latest-mac.yml` a nightly does not have. Flag it while it is still a
      # draft, so publishing it cannot make that mistake.
      - name: Mark a nightly draft as a pre-release
        if: contains(github.ref_name, '-nightly.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease
