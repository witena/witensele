<!--
  Witena application icon — the Aperture mark (S7.1).

  Six near-black blades (`#0d0d0d`) close on a single terracotta point
  (`#d97757`, the `brand-point` token in `src/renderer/src/index.css`) inside a
  hexagon whose outer corners are eased with a 52 px radius: many separate
  members converging on one answer, which is what the product does. The tile is
  white so the mark keeps the same weight on every Dock background;
  `icon-dark.svg` beside this file is the same geometry on an ink tile, for the
  README and any dark surface. It is not the shipped application icon.

  Rendered to `build/icon.png` (1024 px) and then to `build/icon.icns` — see
  `docs/features/packaging/backend.md`, "Building the icon". The 64 px inset
  leaves the padding macOS expects around an app icon, the 200 px corner radius
  matches the macOS squircle closely enough at every iconset size, and the 30 px
  blades are heavy enough to survive the 16 px variant.

  The tile-less mark the rail avatar inlines is the same geometry again, in
  `src/renderer/src/components/ui/brand-mark.tsx`; a change here is a change
  there.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision">
<rect x="64" y="64" width="896" height="896" rx="200" fill="#ffffff"/>
      <g fill="none" stroke="#0d0d0d" stroke-width="30" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M 538.0 227.0 A 52 52 0 0 0 486.0 227.0 L 278.2 347.0 A 52 52 0 0 0 252.2 392.0 L 252.2 632.0 A 52 52 0 0 0 278.2 677.0 L 486.0 797.0 A 52 52 0 0 0 538.0 797.0 L 745.8 677.0 A 52 52 0 0 0 771.8 632.0 L 771.8 392.0 A 52 52 0 0 0 745.8 347.0 L 538.0 227.0 Z"/>
        <line x1="512" y1="212" x2="338.8" y2="512"/>
        <line x1="252.2" y1="362" x2="425.4" y2="662"/>
        <line x1="252.2" y1="662" x2="598.6" y2="662"/>
        <line x1="512" y1="812" x2="685.2" y2="512"/>
        <line x1="771.8" y1="662" x2="598.6" y2="362"/>
        <line x1="771.8" y1="362" x2="425.4" y2="362"/>
      </g>
      <circle cx="512" cy="512" r="56" fill="#d97757"/>
</svg>
