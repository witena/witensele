<!--
  The Aperture mark on an ink tile (S7.1).

  The same geometry as `icon.svg` with the tile and the blades swapped: white
  blades on `#0d0d0d`, the terracotta point unchanged. **This is not the shipped
  application icon** — `electron-builder.yml` points at `icon.icns`, which comes
  from `icon.svg` — it is kept beside the source so the README and any other dark
  surface have a version of the mark that does not carry a white slab.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision">
<rect x="64" y="64" width="896" height="896" rx="200" fill="#0d0d0d"/>
      <g fill="none" stroke="#f5f7fa" stroke-width="30" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M 538.0 227.0 A 52 52 0 0 0 486.0 227.0 L 278.2 347.0 A 52 52 0 0 0 252.2 392.0 L 252.2 632.0 A 52 52 0 0 0 278.2 677.0 L 486.0 797.0 A 52 52 0 0 0 538.0 797.0 L 745.8 677.0 A 52 52 0 0 0 771.8 632.0 L 771.8 392.0 A 52 52 0 0 0 745.8 347.0 L 538.0 227.0 Z"/>
        <line x1="504" y1="225.9" x2="338.8" y2="512"/>
        <line x1="260.2" y1="375.9" x2="425.4" y2="662"/>
        <line x1="268.2" y1="662" x2="598.6" y2="662"/>
