        <line x1="763.8" y1="648.1" x2="598.6" y2="362"/>
        <line x1="755.8" y1="362" x2="425.4" y2="362"/>
      </g>
      <circle cx="512" cy="512" r="56" fill="#d97757"/>
</svg>
