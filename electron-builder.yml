# electron-builder configuration (S4.4, extended by S7.2 and S7.3).
#
# macOS only: Witena is a single-user macOS desktop app (PLAN.md, "Context"),
# and a build for a platform nobody has tested the layout on would be a promise
# the project cannot keep. Both macOS architectures are produced — two dmgs,
# not one universal binary, because a universal build doubles every download
# for the many who need one half of it.
#
# **Signing is configured but conditional (S7.3).** There is no `identity` key
# at all any more: electron-builder then looks for a Developer ID Application
# certificate in the keychain and signs with it, or — finding none — logs
# "skipped macOS application code signing" and produces exactly the unsigned
# bundle this repository produced before. Notarization sits behind the same
# gate twice over: `notarizeIfProvided` is only reached after a *successful*
# signature, and it skips itself when none of the credential variables
# (APPLE_KEYCHAIN_PROFILE, or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
# APPLE_TEAM_ID) is set. So `npm run dist` keeps working on a machine with
# neither a certificate nor credentials, and starts signing and notarizing the
# moment both exist, with no edit here.
#
# See docs/features/packaging/backend.md, "Signing and notarization", for the
# local procedure, the CI secrets and what a user sees in each case.
appId: com.witena.app
productName: Witena
directories:
  output: dist
  buildResources: build

# `out/**` is everything electron-vite produced (main, preload, renderer) and
# `package.json` carries `main` plus the production dependency list.
# `node_modules` is not listed: electron-builder appends the production
# dependency tree on its own, and spelling it out here would only let the two
# lists drift apart.
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/.DS_Store'

# better-sqlite3 is a native module: its `.node` binary has to sit on the real
# filesystem, because `dlopen` cannot read out of an asar archive. Everything
# else stays packed.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# The skills shipped with the build. `src/main/index.ts` seeds them into an
# empty library on first launch and looks for them at
# `process.resourcesPath/resources/skills` when packaged — the `to` below is
# what makes that path true.
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
      - '!**/.DS_Store'
  # The Anthropic CLI (`ant`), so Sign in works on a machine that never
  # installed it. `scripts/fetch-ant.mjs` fills `vendor/ant/<arch>` from the
  # release pinned in `build/ant-release.json`; `${arch}` makes each dmg carry
  # its own architecture's binary. It lands in `Contents/Resources/bin`, where
  # `src/main/index.ts` points the CLI wrapper, and is signed with the rest of
  # the bundle because osx-sign walks every Mach-O file under `Contents`.
  - from: vendor/ant/${arch}
    to: bin
    filter:
      - 'ant'
  # Its MIT notice, which the licence requires to travel with every copy. The
  # release archive does not carry one, so the text is committed beside the pin.
  - from: build/ant.LICENSE
    to: bin/ant.LICENSE

# The `witena://chat/<id>` deep link (S10.3). Every MCP tool result carries one,
# so a coding agent's answer can end with a link that opens the discussion in
# the app. electron-builder turns this block into a `CFBundleURLTypes` entry in
# the bundle's Info.plist, which is what makes LaunchServices hand the URL to
# Witena at all; `app.setAsDefaultProtocolClient('witena')` in
# `src/main/index.ts` only claims a scheme the bundle already declares, and it
# runs in packaged builds only — a development checkout must never become the
# machine's handler for a scheme.
#
# `name` is the human-readable `CFBundleURLName`. The scheme has to stay in step
# with `chatUrl` in `src/shared/mcp-tools.ts`; `src/main/launch-args.test.ts`
# pins those two together, and this file is the third spelling.
protocols:
  - name: Witena chat link
    schemes:
      - witena

# S7.4 added the **zip** beside the dmg. It is not a second download offered to
# anyone: `electron-updater`'s macOS updater can only apply a zip — it unpacks
# the new `Witena.app`, verifies its signature against the running one and swaps
# it — and `latest-mac.yml` is written from whatever targets were built, so a
# release with only a dmg produces a feed the updater cannot act on. The dmg
# stays what a human downloads; the zip is what the app downloads.
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.icns

  # Notarization refuses a bundle that is not hardened, so this is not optional
  # once signing exists — and it costs an unsigned build nothing, because the
  # flag is only ever written by `codesign`, which does not run without an
  # identity.
  hardenedRuntime: true

  # The exceptions the hardened runtime needs, and only those: V8's JIT and the
  # executable memory it writes into. The file itself explains every key and
  # says why `disable-library-validation` is deliberately absent.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

  # `gatekeeperAssess: false` — electron-builder's default, spelled out because
  # the alternative is a trap: `spctl --assess` during packaging fails on a
  # bundle that is correctly signed but **not yet notarized**, which is every
  # bundle at the moment it is built. Gatekeeper is verified after the fact
  # instead, by the release workflow and by the local procedure in the docs.
  gatekeeperAssess: false

  # electron-builder's built-in @electron/notarize integration. It reads its
  # credentials from the environment and takes one of three forms:
  #
  #   locally  APPLE_KEYCHAIN_PROFILE  a profile created once with
  #                                    `xcrun notarytool store-credentials`
  #                                    (plus APPLE_KEYCHAIN for a non-default
  #                                    keychain)
  #   in CI    APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
  #   either   APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER
  #
  # With none of them set it logs "skipped macOS notarization" and the build
  # succeeds, which is what keeps the unsigned path working. There is no
  # `notarize:` sub-object in electron-builder 26 — the option is a boolean and
  # `true` means "do not disable it"; every credential lives in the
  # environment, never in this file.
  notarize: true

dmg:
  # ${arch} is what keeps the two builds apart — Witena-0.1.0-arm64.dmg and
  # Witena-0.1.0-x64.dmg land in the same Release and must not collide.
  artifactName: ${productName}-${version}-${arch}.${ext}

# Where `.github/workflows/release.yml` uploads a tagged build, and the feed
# S7.4's electron-updater will read. `owner` and `repo` are deliberately not
# spelled out: electron-builder derives them from the git remote
# (witena/witensele here), so a tag pushed on a fork produces a draft Release
# on that fork rather than trying to write to this one.
#
# `draft` is the point of the whole arrangement: CI packages, a human reads the
# artifacts and presses Publish.
publish:
  provider: github
  releaseType: draft
